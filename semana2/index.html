<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participa junto a la comunidad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="contenedor">
      <h1>Nos encantaria escucharte</h1>

      <p>
        Este formulario es para que puedas compartir tus ideas, propuestas o necesidades.
        Tu opinión es importante para mejorar la comunidad.
      </p>

      <form>
        <div class="campo">
          <label for="nombre">¿Como te llamas?</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Escribe tu nombre">
        </div>

        <div class="campo">
          <label for="propuesta">¿Que propondrìas o comentarìas?</label>
          <textarea 
            id="propuesta" 
            name="propuesta" 
            placeholder="Escribe tu propuesta para la comunidad"></textarea>
        </div>

        <div class="campo">
          <label for="contacto">Si quieres, déjanos un correo o teléfono</label>
          <input 
            type="text" 
            id="contacto" 
            name="contacto" 
            placeholder="Este campo es opcional">
        </div>

        <div class="campo">
          <label>
            <input type="checkbox" name="consentimiento">
            Estoy de acuerdo en que usen esta información solo para temas de la comunidad.
          </label>
        </div>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

</body>
</html>
